<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ product.meta_title|default:"Enterprise Server Solutions | Zaco Computers" }}</title>
  <meta name="description" content="{{ product.meta_description|default:'Enterprise server pricing and solutions' }}">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===========================
   ABOUT-US INSPIRED PPC THEME
=========================== */

body.ppc-theme {
  background: #f5f6f7;
  color: #2c2c2c;
  font-family: "Kumbh Sans", sans-serif;
}

/* HERO */
.ppc-theme .ppc-hero {
  background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
  color: #fff;
  padding: 100px 0;
}

/* HERO HEADINGS */
.ppc-theme .ppc-hero h1 {
  font-size: 48px;
  font-weight: 800;
}

.ppc-theme .ppc-hero h2 {
  color: #4bbf73;
  font-weight: 600;
}

/* SUB TEXT */
.ppc-theme .ppc-hero p {
  color: #dcdcdc;
  font-size: 16px;
}

/* BUTTONS */
.ppc-theme .btn-call {
  background: #ffaa17;
  color: #000;
  font-weight: 600;
  border-radius: 6px;
}

.ppc-theme .btn-quote {
  background: #4bbf73;
  color: #fff;
  border-radius: 6px;
}

/* SECTION BACKGROUNDS */
.ppc-theme section {
  background: #ffffff;
}

.ppc-theme .why-choose,
.ppc-theme .ppc-main {
  background: #f5f6f7;
  padding: 80px 0;
}

/* SECTION HEADINGS */
.ppc-theme h3 {
  font-weight: 700;
  color: #1f2933;
}

/* CHECK LIST */
.ppc-theme ul li {
  color: #444;
  margin-bottom: 8px;
}

/* FORM CARD */
.ppc-theme .quote-box {
  background: #ffffff;
  border-radius: 12px;
  padding: 35px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* INPUTS */
.ppc-theme input,
.ppc-theme select {
  border-radius: 6px;
  border: 1px solid #ddd;
  padding: 12px;
}

/* FORM BUTTON */
.ppc-theme .quote-box button {
  background: #4bbf73;
  color: #fff;
  font-weight: 600;
  padding: 14px;
}

/* FOOTER */
.ppc-theme footer {
  background: #0f172a;
  color: #ccc;
}
</style>

</head>
<body>

{% block content %}{% endblock %}

</body>
</html>
