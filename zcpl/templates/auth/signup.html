{% extends "base.html" %}
{% block content %}
<div class="container py-5 mt-5">
  <h2>Sign Up</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
  </form>
  <p>Already have an account? <a href="{% url 'signin' %}">Sign In</a></p>
</div>
{% endblock %}
