
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container py-5" id="space">
  <div class="card shadow-lg rounded p-4 text-center" style="max-width: 600px; margin: auto;">
    <div class="mb-4">
      <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
    </div>
    <h2 class="mb-3">Thank You for Your Order!</h2>
    <p class="lead">Your order has been successfully placed and is awaiting manual payment verification.</p>

    <hr class="my-4">

    <div class="text-left mt-4">
      <p><strong>Order ID:</strong> {{ order.id }}</p>
      <p><strong>Transaction ID:</strong> {{ order.transaction_id }}</p>
      <p><strong>Status:</strong> Pending Verification</p>
    </div>

    <a href="{% url 'shop' %}" class="btn btn-primary mt-3">Continue Shopping</a>
  </div>
</div>

</body>
</html>
