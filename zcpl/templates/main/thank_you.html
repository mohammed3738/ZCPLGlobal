<div style="display: none;">{% include "base.html" %}</div>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .thank-you-container {
      text-align: center;
      z-index: 1;
    }

    h1 {
      font-size: 4rem;
      color: #000;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3rem;
      color: #000;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 12px 25px;
      background: #007bff;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    a:hover {
      background: #0056b3;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      top: -10px;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <h1>Thank You!</h1>
    <p>Your message has been successfully submitted.<br>We’ll get back to you soon!</p>
    <a href="/">Back to Home</a>
  </div>

  {% comment %} <script>
    function createConfetti() {
      const colors = ['#FFC107', '#28A745', '#007BFF', '#DC3545', '#FF69B4'];
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        document.body.appendChild(confetti);
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
        confetti.style.opacity = Math.random();
        confetti.style.transform = `scale(${Math.random()})`;
        setTimeout(() => {
          confetti.remove();
        }, 5000);
      }
    }

    setInterval(createConfetti, 500);
  </script> {% endcomment %}
</body>
</html>
